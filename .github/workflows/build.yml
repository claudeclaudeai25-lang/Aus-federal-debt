name: Rebuild chart

on:
  schedule:
    # 3rd of each month, 21:17 UTC (8:17 am next day in Melbourne).
    # The Final Budget Outcome comes out each September; monthly checks catch it.
    - cron: "17 21 3 * *"
  workflow_dispatch: # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: rebuild-chart
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build page
        run: python build.py

      - name: Commit updated page and data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Rebuild chart with latest data"
            git push
          fi
